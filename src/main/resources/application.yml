spring:
  application:
    name: om-sai-coaching-erp

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/omsai}
    username: ${DB_USERNAME:tojo}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

  messages:
    basename: messages

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  business-timezone: ${BUSINESS_TIMEZONE:Asia/Kolkata}
  security:
    bcrypt-strength: 12
  login-rate-limit:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window-minutes: ${LOGIN_WINDOW_MINUTES:15}
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN:false}
      name: ${APP_ADMIN_NAME:}
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:}
  # The demo dataset: the curated course catalogue and the fictional
  # sample identities of a demonstration environment. It is off unless
  # it is switched on explicitly, and it may only be written to the
  # database that is named here. See README "Demo dataset".
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    target-database: ${DEMO_DATA_TARGET_DATABASE:}

logging:
  level:
    root: INFO
    com.omsai.coaching: INFO
