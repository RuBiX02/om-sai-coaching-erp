# Production profile.
#
# Activated with:  SPRING_PROFILES_ACTIVE=prod
#
# Everything the application needs from the environment is REQUIRED
# here: there is no development default and no built-in password. A
# missing variable makes the application refuse to start, which is
# much better than a production system silently using the local
# development credentials.
#
# Required environment variables:
#   DB_URL          jdbc:postgresql://<host>:5432/<database>
#   DB_USERNAME     the database user
#   DB_PASSWORD     the database password
#
# Optional (with a safe default):
#   APP_BOOTSTRAP_ADMIN  false - set it to true only for the very first
#                         start, together with APP_ADMIN_EMAIL and
#                         APP_ADMIN_PASSWORD
#   APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD  the first administrator
#   SERVER_PORT           8080
#   APP_BUSINESS_TIMEZONE Asia/Kolkata
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  server:
    port: ${SERVER_PORT:8080}
    forward-headers-strategy: framework
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # Behind HTTPS (see README "Production deployment") the cookie
        # must be marked "secure" as well.
        secure: ${SESSION_COOKIE_SECURE:true}

app:
  business-timezone: ${APP_BUSINESS_TIMEZONE:Asia/Kolkata}
  security:
    # The production hash cost: deliberately slow, so a stolen database
    # of hashes is expensive to attack.
    bcrypt-strength: 12
    login-rate-limit:
      max-attempts: 5
      window-minutes: 15
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN:false}
      name: ${APP_ADMIN_NAME:Om Sai Administrator}
      email: ${APP_ADMIN_EMAIL}
      password: ${APP_ADMIN_PASSWORD}
  demo:
    # The demo dataset is PINNED OFF in production. The value is a
    # literal, not an environment variable, so even
    # DEMO_DATA_ENABLED=true in the environment has no effect on this
    # profile. A production database can therefore never be filled with
    # fictional courses and identities by configuration alone.
    enabled: false
    target-database: ""

logging:
  level:
    root: INFO
    com.omsai.coaching: INFO
  file:
    name: ${APP_LOG_FILE:logs/omsai.log}
