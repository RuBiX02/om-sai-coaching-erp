<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Something went wrong')}"></head>
<body class="app-body">
<div th:replace="~{layout/fragments :: sidebar('none')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar('Something went wrong', false)}"></div>
  <main class="app-content">
    <div class="empty-state card py-5 my-5">
      <i class="bi bi-exclamation-triangle d-block mb-2"></i>
      <h1 class="h4" th:text="${errorMessage} ?: 'Something went wrong'">Something went wrong</h1>
      <p class="mb-3">You can try again. If the problem keeps happening, contact the system administrator.</p>
      <a th:href="@{/}" class="btn btn-primary">Back to dashboard</a>
    </div>
  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
