<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Not found')}"></head>
<body class="app-body">
<div th:replace="~{layout/fragments :: sidebar('none')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar('Page not found', false)}"></div>
  <main class="app-content">
    <div class="empty-state card py-5 my-5">
      <i class="bi bi-compass d-block mb-2"></i>
      <h1 class="h4">That page does not exist</h1>
      <p class="mb-3">It may have been moved, or the link you used may be wrong.</p>
      <a th:href="@{/}" class="btn btn-primary">Back to dashboard</a>
    </div>
  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
