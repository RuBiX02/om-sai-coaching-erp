<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('New quiz')}"></head>
<body class="app-body">
<div th:replace="~{layout/fragments :: sidebar('quizzes')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar('New quiz', true)}"></div>
  <main class="app-content">

    <div th:replace="~{layout/fragments :: alerts()}"></div>

    <div class="row">
      <div class="col-xl-7">
        <form th:action="@{/quizzes}" method="post" novalidate>
          <div class="card">
            <div class="card-header"><i class="bi bi-ui-checks me-2 table-thumb"></i>Quiz details</div>
            <div class="card-body">
              <div class="mb-3">
                <label for="batchSubjectId" class="form-label required-label">Class and subject</label>
                <select id="batchSubjectId" name="batchSubjectId" class="form-select" required>
                  <option value="">— choose the assignment —</option>
                  <option th:each="assignment : ${assignments}" th:value="${assignment.id}"
                          th:text="${assignment.batch.course.name} + ' · ' + ${assignment.batch.name}
                              + ' · ' + ${assignment.courseSubject.subject.name}">
                    Course · Batch · Subject
                  </option>
                </select>
                <div class="form-text">
                  The batch and the subject of the quiz come from the assignment — the student
                  portal shows the quiz to that batch only.
                </div>
              </div>
              <div class="mb-3">
                <label for="title" class="form-label required-label">Title</label>
                <input type="text" id="title" name="title" class="form-control" maxlength="160"
                       placeholder="e.g. Kinematics quick check"/>
              </div>
              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" name="description" rows="3" class="form-control"
                          maxlength="500"
                          placeholder="What the quiz covers — one or two lines."></textarea>
              </div>
              <div class="mb-0">
                <label for="durationMinutes" class="form-label">Suggested duration (minutes)</label>
                <input type="number" id="durationMinutes" name="durationMinutes" class="form-control"
                       value="10" min="1" max="120" required/>
                <div class="form-text">Between 1 and 120 minutes. The portal shows it as guidance.</div>
              </div>
            </div>
            <div class="card-footer d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i>Create quiz and add questions
              </button>
              <a th:href="@{/quizzes}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>

  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
