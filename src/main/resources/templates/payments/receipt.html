<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:with="r=${payment.receiptNumber}" th:text="|Receipt ${r} · Om Sai Coaching ERP|">Receipt</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/receipt.css}"/>
</head>
<body class="bg-body-tertiary">

<!-- The sheet is shared with the student portal to keep both reprints identical. -->
<div th:replace="~{layout/receipt-sheet :: sheet(${payment}, ${outstandingNow},
                    @{/fees/{id}(id=${payment.feeAccount.id})})}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
