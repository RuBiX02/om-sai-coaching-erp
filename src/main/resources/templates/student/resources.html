<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Study resources')}"></head>
<body class="app-body">
<a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>
<div th:replace="~{layout/fragments :: sidebar('resources')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar('Study resources', true)}"></div>
  <main class="app-content" id="main" tabindex="-1">

    <div th:replace="~{layout/fragments :: alerts()}"></div>

    <header class="page-header">
      <div>
        <p class="page-eyebrow">
          <i class="bi bi-journal-bookmark" aria-hidden="true"></i>
          <span th:text="${student.fullName}">Student</span>
        </p>
        <h2 class="page-title">Study resources</h2>
        <p class="page-subtitle">Notes, worksheets and curated links for the subjects of your batches.</p>
      </div>
      <div class="page-header-meta">
        <i class="bi bi-collection" aria-hidden="true"></i>
        <span th:text="${#lists.size(bySubject)} + ' subject group(s)'">0 subject group(s)</span>
      </div>
    </header>

    <div th:each="entry : ${bySubject}" class="mb-3">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="section-title">
            <i class="bi bi-journal-text" aria-hidden="true"></i>
            <span th:text="${entry.key}">Subject</span>
          </span>
          <span class="badge text-bg-info" th:text="${#lists.size(entry.value)} + ' item(s)'">0 item(s)</span>
        </div>
        <div class="list-group list-group-flush">
          <div class="list-group-item" th:each="resource : ${entry.value}">
            <div class="d-flex justify-content-between align-items-start gap-2">
              <div>
                <div class="fw-semibold" th:text="${resource.title}">Resource title</div>
                <div class="small text-body-secondary" th:if="${resource.description != null}"
                     th:text="${resource.description}">What this resource covers.</div>
              </div>
              <span class="badge text-bg-light"
                    th:text="${resource.resourceType}">NOTES</span>
            </div>
            <a th:if="${resource.url != null}" th:href="${resource.url}"
               class="btn btn-sm btn-outline-primary mt-2" target="_blank" rel="noopener">
              <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>Open
            </a>
          </div>
        </div>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(bySubject)}" class="card">
      <div class="empty-state">
        <i class="bi bi-journal-x d-block" aria-hidden="true"></i>
        <span class="empty-title">No resources yet</span>
        <span class="empty-sub">The institute adds material for your subjects here.</span>
      </div>
    </div>

  </main>
</div>
</body>
</html>
