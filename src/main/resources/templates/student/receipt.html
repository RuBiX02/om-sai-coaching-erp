<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  The student's own reprint of a payment receipt. Same printable sheet
  the office issues; the back button returns to the portal, the print
  behaviour is identical, and the route is guarded to the student's own
  payments.
-->
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:with="r=${payment.receiptNumber}" th:text="|Receipt ${r} · Om Sai Coaching ERP|">Receipt</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/receipt.css}"/>
</head>
<body class="bg-body-tertiary">

<div th:replace="~{layout/receipt-sheet :: sheet(${payment}, ${outstandingNow}, @{/student/fees})}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
