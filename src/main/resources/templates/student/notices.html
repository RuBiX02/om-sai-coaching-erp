<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Notice board')}"></head>
<body class="app-body">
<div th:replace="~{layout/fragments :: sidebar('notices')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar('Notice board', true)}"></div>
  <main class="app-content">

    <div th:replace="~{layout/fragments :: alerts()}"></div>

    <header class="page-header">
      <div>
        <p class="page-eyebrow">
          <i class="bi bi-megaphone" aria-hidden="true"></i><span>Student portal</span>
        </p>
        <h2 class="page-title">Notice board</h2>
        <p class="page-subtitle">
          Everything the institute has told you or your batch, newest first.
        </p>
      </div>
      <div class="page-header-meta">
        <i class="bi bi-envelope-open" aria-hidden="true"></i>
        <span th:text="${#lists.size(notices)} + ' notice(s)'">0 notice(s)</span>
      </div>
    </header>

    <div class="row g-3">
      <div class="col-xl-9" th:each="notice : ${notices}">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="section-title">
              <i class="bi bi-megaphone" aria-hidden="true"></i><span th:text="${notice.title}">Notice title</span>
            </span>
            <span class="d-flex align-items-center gap-2">
              <span class="badge text-bg-warning" th:if="${unreadIds.contains(notice.id)}">New</span>
              <span class="badge text-bg-info" th:if="${notice.audience.name() == 'ALL'}">Everyone</span>
              <span class="badge text-bg-secondary" th:if="${notice.audience.name() == 'BATCH'}"
                    th:text="${notice.batch != null ? notice.batch.name : 'My batch'}">Batch</span>
            </span>
          </div>
          <div class="card-body">
            <p class="notice-body mb-2" th:text="${notice.body}">The notice text.</p>
            <div class="small text-body-secondary">
              <i class="bi bi-clock-history me-1" aria-hidden="true"></i>
              <span th:text="${#temporals.format(notice.publishedAt, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 09:00</span>
              <span th:text="' · ' + ${notice.publishedBy.fullName}"> · Administrator</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(notices)}" class="card">
      <div class="empty-state">
        <i class="bi bi-megaphone d-block" aria-hidden="true"></i>
        <span class="empty-title">Nothing on the notice board</span>
        <span class="empty-sub">Institute notices addressed to you or your batch appear here.</span>
      </div>
    </div>

  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
