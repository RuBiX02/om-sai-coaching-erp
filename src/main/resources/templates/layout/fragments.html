<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  Reusable layout fragments: head, sidebar, topbar, flash alerts, pager and
  the shared status badge. Each full page template renders its own <body>
  and includes these.

  The shell is role aware: only destinations the signed-in role may
  actually open are rendered (see com.omsai.coaching.security.SecurityConfig).
  The navigation is grouped around administrative workflows: Overview,
  People, Academics, Operations, Finance and Administration.
-->
<head th:fragment="head(title)" th:with="t=${#strings.isEmpty(title) ? 'Om Sai Coaching' : title}">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#18243B"/>
  <title th:text="|${t} · Om Sai Coaching ERP|">Om Sai Coaching ERP</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>

<aside th:fragment="sidebar(active)" class="app-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="appSidebar">
  <div class="offcanvas-header d-lg-none border-bottom">
    <span class="brand-mini"><i class="bi bi-mortarboard-fill"></i>Om Sai Coaching</span>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#appSidebar" aria-label="Close"></button>
  </div>

  <div class="app-brand d-none d-lg-flex">
    <!-- The institute emblem: a graduation cap with a saffron accent.
         Inline SVG keeps the mark crisp and avoids an extra request. -->
    <svg class="brand-mark" viewBox="0 0 32 32" role="img" aria-label="Om Sai Coaching emblem">
      <rect width="32" height="32" rx="9" fill="#18243B"/>
      <path d="M16 7 3.5 12.6 16 18.2l8.8-4V20h1.9v-8.4L16 7z" fill="#ffffff"/>
      <path d="M7.6 16.1v4.6c0 1.6 3.8 2.9 8.4 2.9s8.4-1.3 8.4-2.9v-4.6L16 19.2 7.6 16.1z"
            fill="#ffffff" opacity=".82"/>
      <circle cx="25.4" cy="7.4" r="3.1" fill="#F4A62A"/>
    </svg>
    <span class="brand-text">
      <span class="brand-name">Om Sai Coaching</span>
      <span class="brand-sub">Management ERP</span>
    </span>
  </div>

  <div class="app-sidebar-body">
    <nav class="nav flex-column app-nav" aria-label="Main navigation">
      <a th:fragment="navitem(item, label, icon, target)"
         th:classappend="${active == item} ? 'active' : ''"
         th:attr="aria-current=${active == item} ? 'page' : null, data-label=${label}"
         class="nav-link app-nav-link"
         th:href="${target}">
        <i th:class="|bi ${icon}|" aria-hidden="true"></i><span th:text="${label}">Item</span>
      </a>

      <!-- The same item, with the honest count of unread items beside it
           (the notice board). No count renders when everything is read. -->
      <a th:fragment="navitemUnread(item, label, icon, target, count)"
         th:classappend="${active == item} ? 'active' : ''"
         th:attr="aria-current=${active == item} ? 'page' : null, data-label=${label}"
         class="nav-link app-nav-link d-flex align-items-center justify-content-between"
         th:href="${target}">
        <span class="d-inline-flex align-items-center gap-2">
          <i th:class="|bi ${icon}|" aria-hidden="true"></i><span th:text="${label}">Item</span>
        </span>
        <span class="badge rounded-pill text-bg-danger"
              th:if="${count != null and count > 0}"
              th:text="${count}"
              th:attr="aria-label=|${count} unread|">3</span>
      </a>

      <!-- ================= student portal ================= -->
      <div th:if="${isStudent == true}">
        <div class="nav-group">
          <div th:replace="~{layout/fragments :: navitem('dashboard', 'My dashboard', 'bi-grid-1x2', @{/student})}"></div>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">My learning</div>
          <div th:replace="~{layout/fragments :: navitem('timetable', 'My timetable', 'bi-calendar-week', @{/student/timetable})}"></div>
          <div th:replace="~{layout/fragments :: navitem('sessions', 'My attendance', 'bi-calendar2-check', @{/student/attendance})}"></div>
          <div th:replace="~{layout/fragments :: navitem('examinations', 'My results', 'bi-journal-check', @{/student/results})}"></div>
          <div th:replace="~{layout/fragments :: navitem('resources', 'Study resources', 'bi-journal-text', @{/student/resources})}"></div>
          <div th:replace="~{layout/fragments :: navitem('quizzes', 'Quizzes', 'bi-ui-checks', @{/student/quizzes})}"></div>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">From the institute</div>
          <div th:replace="~{layout/fragments :: navitemUnread('notices', 'Notice board', 'bi-megaphone', @{/student/notices}, ${noticeUnread})}"></div>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">My account</div>
          <div th:replace="~{layout/fragments :: navitem('fees', 'My fees', 'bi-wallet2', @{/student/fees})}"></div>
          <div th:replace="~{layout/fragments :: navitem('profile', 'My profile', 'bi-person', @{/student/profile})}"></div>
        </div>
      </div>

      <!-- ================= teacher ================= -->
      <div th:if="${isTeacher == true}">
        <div class="nav-group">
          <div th:replace="~{layout/fragments :: navitem('dashboard', 'My dashboard', 'bi-grid-1x2', @{/teacher})}"></div>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">My teaching</div>
          <div th:replace="~{layout/fragments :: navitem('sessions', 'Class sessions', 'bi-calendar2-check', @{/sessions})}"></div>
          <div th:replace="~{layout/fragments :: navitem('timetable', 'Timetable', 'bi-calendar-week', @{/timetable})}"></div>
          <div th:replace="~{layout/fragments :: navitem('examinations', 'Examinations', 'bi-journal-check', @{/examinations})}"></div>
          <div th:replace="~{layout/fragments :: navitem('quizzes', 'Quizzes', 'bi-ui-checks', @{/quizzes})}"></div>
        </div>
      </div>

      <!-- ================= administrator ================= -->
      <div th:if="${isAdmin == true}">
        <div class="nav-group">
          <div th:replace="~{layout/fragments :: navitem('dashboard', 'Dashboard', 'bi-grid-1x2', @{/dashboard})}"></div>
        </div>

        <div class="nav-group">
          <div class="nav-group-title">People</div>
          <div th:replace="~{layout/fragments :: navitem('students', 'Students', 'bi-people', @{/students})}"></div>
          <div th:replace="~{layout/fragments :: navitem('teachers', 'Teachers', 'bi-person-video3', @{/teachers})}"></div>
        </div>

        <div class="nav-group">
          <div class="nav-group-title">Academics</div>
          <div th:replace="~{layout/fragments :: navitem('courses', 'Courses', 'bi-journal-bookmark', @{/courses})}"></div>
          <div th:replace="~{layout/fragments :: navitem('subjects', 'Subjects', 'bi-book', @{/subjects})}"></div>
          <div th:replace="~{layout/fragments :: navitem('batches', 'Batches', 'bi-collection', @{/batches})}"></div>
          <div th:replace="~{layout/fragments :: navitem('timetable', 'Timetable', 'bi-calendar-week', @{/timetable})}"></div>
          <div th:replace="~{layout/fragments :: navitem('quizzes', 'Quizzes', 'bi-ui-checks', @{/quizzes})}"></div>
        </div>

        <div class="nav-group">
          <div class="nav-group-title">Operations</div>
          <div th:replace="~{layout/fragments :: navitem('sessions', 'Class sessions', 'bi-calendar2-check', @{/sessions})}"></div>
          <div th:replace="~{layout/fragments :: navitem('attendance', 'Attendance reports', 'bi-clipboard-data', @{/attendance/reports})}"></div>
          <div th:replace="~{layout/fragments :: navitem('examinations', 'Examinations', 'bi-journal-check', @{/examinations})}"></div>
          <div th:replace="~{layout/fragments :: navitem('notices', 'Notice board', 'bi-megaphone', @{/notices})}"></div>
        </div>

        <div class="nav-group">
          <div class="nav-group-title">Finance</div>
          <div th:replace="~{layout/fragments :: navitem('fees', 'Fees', 'bi-cash-coin', @{/fees})}"></div>
          <div th:replace="~{layout/fragments :: navitem('installments', 'Installments', 'bi-calendar2-week', @{/installments})}"></div>
          <div th:replace="~{layout/fragments :: navitem('payments', 'Payments', 'bi-receipt', @{/payments})}"></div>
        </div>

        <div class="nav-group">
          <div class="nav-group-title">Administration</div>
          <div th:replace="~{layout/fragments :: navitem('users', 'Accounts', 'bi-person-gear', @{/users})}"></div>
        </div>
      </div>
    </nav>
  </div>

  <div class="app-sidebar-footer d-none d-lg-block">
    <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseToggle"
            aria-expanded="true" aria-controls="appSidebar">
      <i class="bi bi-layout-sidebar" aria-hidden="true"></i>
      <span>Collapse menu</span>
    </button>
  </div>
</aside>

<header th:fragment="topbar(title, showUser)"
        class="app-topbar">
  <button class="hamburger d-lg-inline-flex" type="button"
          data-bs-toggle="offcanvas" data-bs-target="#appSidebar" aria-controls="appSidebar"
          aria-label="Open navigation menu">
    <i class="bi bi-list" aria-hidden="true"></i>
  </button>
  <div class="flex-grow-1 min-w-0">
    <h1 class="text-truncate" th:text="${title}">Page</h1>
  </div>
  <div th:if="${showUser} and ${userName != null}" class="d-flex align-items-center gap-2">
    <span class="topbar-identity">
      <span class="topbar-avatar" aria-hidden="true"
            th:text="${#strings.substring(userName, 0, 1)}">O</span>
      <span class="d-none d-sm-flex flex-column">
        <span class="topbar-user" th:text="${userName}">user</span>
        <span class="topbar-role"
              th:if="${isAdmin == true}">Administrator</span>
        <span class="topbar-role"
              th:unless="${isAdmin == true}"
              th:text="${isTeacher == true} ? 'Teacher' : (${isStudent == true} ? 'Student' : 'User')">Role</span>
      </span>
    </span>
    <form th:action="@{/logout}" method="post" class="m-0">
      <button type="submit" class="topbar-signout" aria-label="Sign out">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        <span class="d-none d-sm-inline">Sign out</span>
      </button>
    </form>
  </div>
</header>

<!--
  The one page-heading composition used by every admin screen. The
  surrounding <header class="page-header"> keeps the page-specific
  actions on the right; this fragment owns the eyebrow, the page title
  (which must not simply repeat the top-bar title) and the subtitle.
-->
<div th:fragment="pageHeading(icon, eyebrow, title, subtitle)">
  <p class="page-eyebrow">
    <i class="bi" th:classappend="${'bi-' + icon}" aria-hidden="true"></i>
    <span th:text="${eyebrow}">Section</span>
  </p>
  <h2 class="page-title" th:text="${title}">Page</h2>
  <p class="page-subtitle" th:if="${subtitle != null and !#strings.isEmpty(subtitle)}"
     th:text="${subtitle}">Description</p>
</div>

<div th:fragment="alerts()" th:if="${successMessage != null or errorMessage != null}" class="app-alerts mb-3">
  <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}">Success</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}">Error</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
</div>

<!-- Reusable pagination controls. Expects: page (org.springframework.data.domain.Page), pageUrl (base URL string). -->
<nav th:fragment="pager(page, pageUrl)" th:if="${page != null and page.totalPages > 1}"
     aria-label="Pagination" class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
  <span class="text-body-secondary small">
    <span th:text="'Page ' + (${page.number} + 1) + ' of ' + ${page.totalPages}"></span>&nbsp;
    &middot;&nbsp;<span th:text="|${page.totalElements} record(s)|"></span>
  </span>
  <ul class="pagination pagination-sm m-0">
    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
      <a class="page-link" th:href="|${pageUrl}${pageUrl.contains('?') ? '&' : '?'}page=0|">First</a>
    </li>
    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
      <a class="page-link" th:href="|${pageUrl}${pageUrl.contains('?') ? '&' : '?'}page=${page.number - 1}|">Previous</a>
    </li>
    <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
        th:if="${i >= (page.number < 5 ? 0 : page.number - 4) and i <= (page.number > page.totalPages - 5 ? page.totalPages - 1 : page.number + 4)}"
        class="page-item" th:classappend="${(page.number) == i} ? 'active'">
      <a class="page-link" th:href="|${pageUrl}${pageUrl.contains('?') ? '&' : '?'}page=${i}|" th:text="|${i + 1}|">1</a>
    </li>
    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
      <a class="page-link" th:href="|${pageUrl}${pageUrl.contains('?') ? '&' : '?'}page=${page.number + 1}|">Next</a>
    </li>
    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
      <a class="page-link" th:href="|${pageUrl}${pageUrl.contains('?') ? '&' : '?'}page=${page.totalPages - 1}|">Last</a>
    </li>
  </ul>
</nav>

<!-- Small reusable status badge for ACTIVE/INACTIVE. The icon carries the
     meaning as well, so the state is never communicated by colour alone. -->
<span th:fragment="statusBadge(active)" th:with="ok=${active}"
      th:class="|badge ${ok ? 'text-bg-success' : 'text-bg-secondary'}|">
  <i th:class="|bi ${ok ? 'bi-check-circle-fill' : 'bi-dash-circle'} me-1|"
     aria-hidden="true"></i>
  <span th:text="${ok ? 'Active' : 'Inactive'}">Active</span>
</span>
</html>
