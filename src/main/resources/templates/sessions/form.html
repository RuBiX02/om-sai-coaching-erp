<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:with="pageTitle=${cs != null ? 'Edit class session' : 'New class session'}">
<head th:replace="~{layout/fragments :: head(${pageTitle})}"></head>
<body class="app-body">
<div th:replace="~{layout/fragments :: sidebar('sessions')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar(${pageTitle}, true)}"></div>
  <main class="app-content">

    <div th:replace="~{layout/fragments :: alerts()}"></div>

    <div class="row">
      <div class="col-xl-7">
        <form th:action="${cs != null} ? @{/sessions/{id}(id=${cs.id})} : @{/sessions}"
              th:object="${form}" method="post" novalidate>
          <div class="card">
            <div class="card-header"><i class="bi bi-calendar2-check me-2 table-thumb"></i>Class session details</div>
            <div class="card-body">
              <div class="mb-3">
                <label for="batchSubjectId" class="form-label required-label">Batch subject</label>
                <select id="batchSubjectId" class="form-select" th:field="*{batchSubjectId}"
                        aria-describedby="batchSubjectError batchSubjectHelp" th:disabled="${cs != null}">
                  <option value="" selected disabled>Choose the batch subject this class belongs to&hellip;</option>
                  <option th:each="a : ${assignments}" th:value="${a.id}"
                          th:text="${a.batch.academicYear} + ' · ' + ${a.batch.name} + ' — ' + ${a.courseSubject.subject.name}
                                   + (${a.teacher != null} ? ' (' + ${a.teacher.fullName} + ')' : ' (unassigned)')">Batch subject</option>
                </select>
                <input type="hidden" th:if="${cs != null}" th:field="*{batchSubjectId}"/>
                <div class="text-danger small mt-1" id="batchSubjectError" th:if="${#fields.hasErrors('batchSubjectId')}" th:errors="*{batchSubjectId}">Error</div>
                <div id="batchSubjectHelp" class="form-text">
                  <span th:if="${isTeacher}">Only subjects currently assigned to you are listed. The assignment of an existing session never changes.</span>
                  <span th:if="${!isTeacher}">Sessions always belong to one batch-subject assignment.</span>
                </div>
              </div>
              <div class="mb-3">
                <label for="sessionDate" class="form-label required-label">Class date</label>
                <input type="date" id="sessionDate" class="form-control" th:field="*{sessionDate}"
                       aria-describedby="sessionDateError"/>
                <div class="text-danger small mt-1" id="sessionDateError" th:if="${#fields.hasErrors('sessionDate')}" th:errors="*{sessionDate}">Error</div>
              </div>
              <div class="row">
                <div class="col-sm-6 mb-3">
                  <label for="startTime" class="form-label">Start time (optional)</label>
                  <input type="time" id="startTime" class="form-control" th:field="*{startTime}"
                         aria-describedby="startTimeError"/>
                  <div class="text-danger small mt-1" id="startTimeError" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}">Error</div>
                </div>
                <div class="col-sm-6 mb-3">
                  <label for="endTime" class="form-label">End time (optional)</label>
                  <input type="time" id="endTime" class="form-control" th:field="*{endTime}"
                         aria-describedby="endTimeError"/>
                  <div class="text-danger small mt-1" id="endTimeError" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}">Error</div>
                </div>
              </div>
              <div class="text-danger small mb-3" id="timeRangeError"
                   th:if="${#fields.hasErrors('validTimeRange')}" th:errors="*{validTimeRange}">Error</div>
              <div class="mb-3">
                <label for="topic" class="form-label">Topic (optional)</label>
                <input type="text" id="topic" class="form-control" th:field="*{topic}" maxlength="300"
                       placeholder="What was taught in this class" aria-describedby="topicError"/>
                <div class="text-danger small mt-1" id="topicError" th:if="${#fields.hasErrors('topic')}" th:errors="*{topic}">Error</div>
              </div>
              <div class="mb-3">
                <label for="notes" class="form-label">Notes (optional)</label>
                <textarea id="notes" class="form-control" rows="3" th:field="*{notes}"
                          aria-describedby="notesError"></textarea>
                <div class="text-danger small mt-1" id="notesError" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}">Error</div>
              </div>
            </div>
            <div class="card-footer d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i><span th:text="${cs != null ? 'Save changes' : 'Create session'}">Save</span>
              </button>
              <a th:href="${cs != null} ? @{/sessions/{id}(id=${cs.id})} : @{/sessions}"
                 class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>

  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
