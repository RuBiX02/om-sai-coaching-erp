<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Subjects')}"></head>
<body class="app-body">
<a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>
<div th:replace="~{layout/fragments :: sidebar('subjects')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar('Subjects', true)}"></div>
  <main class="app-content" id="main" tabindex="-1">

    <div th:replace="~{layout/fragments :: alerts()}"></div>

    <header class="page-header">
      <div>
        <p class="page-eyebrow">
          <i class="bi bi-book" aria-hidden="true"></i><span>Academics</span>
        </p>
        <h2 class="page-title">Subject catalogue</h2>
        <p class="page-subtitle">The subjects that courses and batches draw from.</p>
      </div>
      <div class="filter-actions">
        <a th:href="@{/subjects/new}" class="btn btn-primary">
          <i class="bi bi-plus-lg" aria-hidden="true"></i>New subject
        </a>
      </div>
    </header>

    <div class="filter-bar">
      <form th:action="@{/subjects}" method="get" class="filter-form">
        <input type="search" class="form-control filter-search" placeholder="Search subject name"
               name="q" th:value="${q}" aria-label="Search subjects"/>
        <button type="submit" class="btn btn-outline-primary">
          <i class="bi bi-search" aria-hidden="true"></i>Search
        </button>
      </form>
    </div>

    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" th:if="${!#lists.isEmpty(subjects.content)}">
            <thead class="table-light">
            <tr>
              <th>Subject</th>
              <th>Description</th>
              <th class="text-center">Status</th>
              <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="subject : ${subjects.content}"
                th:classappend="${!subject.active} ? 'table-light opacity-75'">
              <td><a th:href="@{/subjects/{id}(id=${subject.id})}" class="fw-semibold" th:text="${subject.name}">Mathematics</a></td>
              <td>
                <span class="small text-body-secondary" th:if="${subject.description}"
                      th:text="${#strings.abbreviate(subject.description, 100)}">description</span>
                <span class="small text-body-secondary" th:if="${subject.description == null}">-</span>
              </td>
              <td class="text-center">
                <span class="badge" th:classappend="${subject.active} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${subject.active} ? 'Active' : 'Deactivated'">Active</span>
              </td>
              <td class="text-end">
                <a th:href="@{/subjects/{id}(id=${subject.id})}" class="btn btn-sm btn-outline-secondary" title="View">
                  <i class="bi bi-eye"></i><span class="visually-hidden">View</span>
                </a>
                <a th:href="@{/subjects/{id}/edit(id=${subject.id})}" class="btn btn-sm btn-outline-secondary" title="Edit">
                  <i class="bi bi-pencil"></i><span class="visually-hidden">Edit</span>
                </a>
              </td>
            </tr>
            </tbody>
          </table>
          <div class="empty-state" th:if="${#lists.isEmpty(subjects.content)}">
            <i class="bi bi-book-plus d-block" aria-hidden="true"></i>
            <span class="empty-title">No subjects found</span>
            <a th:href="@{/subjects/new}">Create the first subject</a>.
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{layout/fragments :: pager(${subjects}, ${pagerUrl})}"></div>

  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
