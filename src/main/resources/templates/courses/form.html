<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:with="pageTitle=${course != null ? 'Edit course' : 'New course'}">
<head th:replace="~{layout/fragments :: head(${pageTitle})}"></head>
<body class="app-body">
<a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>
<div th:replace="~{layout/fragments :: sidebar('courses')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar(${pageTitle}, true)}"></div>
  <main class="app-content" id="main" tabindex="-1">

    <div th:replace="~{layout/fragments :: alerts()}"></div>

    <div class="row">
      <div class="col-xl-6">
        <form th:action="${course != null} ? @{/courses/{id}(id=${course.id})} : @{/courses}"
              th:object="${form}" method="post" novalidate>
          <div class="card">
            <div class="card-header"><i class="bi bi-journal-bookmark me-2 table-thumb"></i>Course details</div>
            <div class="card-body">
              <div class="mb-3">
                <label for="name" class="form-label required-label">Course name</label>
                <input type="text" id="name" class="form-control" th:field="*{name}"
                       placeholder="e.g. Class 10 - CBSE" aria-describedby="nameError"/>
                <div class="text-danger small mt-1" id="nameError" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div>
              </div>
              <div class="mb-3">
                <label for="category" class="form-label required-label">Category</label>
                <input type="text" id="category" class="form-control" th:field="*{category}"
                       placeholder="e.g. CBSE Board / Olympiad / Foundation" aria-describedby="categoryError"/>
                <div class="text-danger small mt-1" id="categoryError" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Error</div>
              </div>
              <div class="mb-3">
                <label for="durationMonths" class="form-label">Duration (months, optional)</label>
                <input type="number" min="1" max="120" id="durationMonths" class="form-control"
                       th:field="*{durationMonths}" aria-describedby="durationError durationHelp"/>
                <div class="text-danger small mt-1" id="durationError" th:if="${#fields.hasErrors('durationMonths')}" th:errors="*{durationMonths}">Error</div>
                <div id="durationHelp" class="form-text">Leave empty if the course runs continuously.</div>
              </div>
              <div class="mb-0">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" rows="4" class="form-control" th:field="*{description}"
                          placeholder="What this course covers..." aria-describedby="descriptionError"></textarea>
                <div class="text-danger small mt-1" id="descriptionError" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</div>
              </div>
            </div>
            <div class="card-footer d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i><span th:text="${course != null ? 'Save changes' : 'Create course'}">Save</span>
              </button>
              <a th:href="${course != null} ? @{/courses/{id}(id=${course.id})} : @{/courses}"
                 class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>

  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
