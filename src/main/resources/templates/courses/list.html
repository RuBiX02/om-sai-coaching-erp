<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Courses')}"></head>
<body class="app-body">
<div th:replace="~{layout/fragments :: sidebar('courses')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar('Courses', true)}"></div>
  <main class="app-content">

    <div th:replace="~{layout/fragments :: alerts()}"></div>

    <header class="page-header">
      <div>
        <p class="page-eyebrow">
          <i class="bi bi-journal-bookmark" aria-hidden="true"></i><span>Academics</span>
        </p>
        <h2 class="page-title">Courses</h2>
        <p class="page-subtitle">The programmes the institute offers, grouped by category.</p>
      </div>
      <div class="filter-actions">
        <a th:href="@{/courses/new}" class="btn btn-primary">
          <i class="bi bi-plus-lg" aria-hidden="true"></i>New course
        </a>
      </div>
    </header>

    <div class="filter-bar">
      <form th:action="@{/courses}" method="get" class="filter-form">
        <input type="search" class="form-control filter-search" placeholder="Search name or category"
               name="q" th:value="${q}" aria-label="Search courses"/>
        <select class="form-select" name="status" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
          <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Inactive</option>
        </select>
        <button type="submit" class="btn btn-outline-primary">
          <i class="bi bi-search" aria-hidden="true"></i>Search
        </button>
      </form>
    </div>

    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" th:if="${!#lists.isEmpty(courses.content)}">
            <thead class="table-light">
            <tr>
              <th>Course</th>
              <th>Category</th>
              <th>Duration</th>
              <th class="text-center">Status</th>
              <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${courses.content}">
              <td>
                <a th:href="@{/courses/{id}(id=${course.id})}" class="fw-semibold" th:text="${course.name}">Course name</a>
                <div class="small text-body-secondary" th:if="${course.description}"
                     th:text="${#strings.abbreviate(course.description, 80)}">description</div>
              </td>
              <td><span class="badge text-bg-light border" th:text="${course.category}">Category</span></td>
              <td th:if="${course.durationMonths != null}">
                <span th:text="${course.durationMonths}">12</span> months
              </td>
              <td th:if="${course.durationMonths == null}"><span class="text-body-secondary">-</span></td>
              <td class="text-center">
                <div th:replace="~{layout/fragments :: statusBadge(${course.active})}"></div>
              </td>
              <td class="text-end">
                <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-sm btn-outline-secondary" title="View">
                  <i class="bi bi-eye"></i><span class="visually-hidden">View</span>
                </a>
                <a th:href="@{/courses/{id}/edit(id=${course.id})}" class="btn btn-sm btn-outline-secondary" title="Edit">
                  <i class="bi bi-pencil"></i><span class="visually-hidden">Edit</span>
                </a>
                <form th:action="@{/courses/{id}/status(id=${course.id})}" method="post" class="d-inline">
                  <input type="hidden" name="active" th:value="${course.active ? 'false' : 'true'}"/>
                  <button type="submit" class="btn btn-sm btn-outline-secondary" title="${course.active ? 'Deactivate course' : 'Activate course'}">
                    <i th:class="|bi ${course.active ? 'bi-pause-circle' : 'bi-play-circle'}|"></i>
                    <span class="visually-hidden" th:text="${course.active ? 'Deactivate' : 'Activate'}">toggle</span>
                  </button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
          <div class="empty-state" th:if="${#lists.isEmpty(courses.content)}">
            <i class="bi bi-journal-plus d-block" aria-hidden="true"></i>
            <span class="empty-title">No courses found</span>
            <a th:href="@{/courses/new}">Create the first course</a>.
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{layout/fragments :: pager(${courses}, ${pagerUrl})}"></div>

  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
