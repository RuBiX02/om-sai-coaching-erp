<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Students')}"></head>
<body class="app-body">
<div th:replace="~{layout/fragments :: sidebar('students')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar('Students', true)}"></div>
  <main class="app-content">

    <div th:replace="~{layout/fragments :: alerts()}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <form th:action="@{/students}" method="get" class="d-flex gap-2 flex-wrap">
        <input type="search" class="form-control" placeholder="Search name, code or phone"
               name="q" th:value="${q}" aria-label="Search students"/>
        <select class="form-select w-auto" name="status" aria-label="Filter by status">
          <option value="">All students</option>
          <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active only</option>
          <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Inactive only</option>
        </select>
        <button type="submit" class="btn btn-outline-primary">
          <i class="bi bi-search me-1"></i>Search
        </button>
      </form>
      <a th:href="@{/students/new}" class="btn btn-primary">
        <i class="bi bi-person-plus me-1"></i>Register student
      </a>
    </div>

    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" th:if="${!#lists.isEmpty(students.content)}">
            <thead class="table-light">
            <tr>
              <th>Student code</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Admitted</th>
              <th class="text-center">Status</th>
              <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students.content}">
              <td><span class="font-monospace small" th:text="${student.studentCode}">OMS-2026-00001</span></td>
              <td>
                <a th:href="@{/students/{id}(id=${student.id})}" th:text="${student.fullName}">Student</a>
                <div class="small text-body-secondary"
                     th:if="${student.parentName}" th:text="|Parent: ${student.parentName}|">Parent</div>
              </td>
              <td th:text="${student.phone}">9876543210</td>
              <td th:text="${#temporals.format(student.admissionDate, 'dd MMM yyyy')}">01 Apr 2026</td>
              <td class="text-center">
                <div th:replace="~{layout/fragments :: statusBadge(${student.active})}"></div>
              </td>
              <td class="text-end">
                <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-sm btn-outline-secondary" title="Profile">
                  <i class="bi bi-person"></i><span class="visually-hidden">Profile</span>
                </a>
                <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-sm btn-outline-secondary" title="Edit">
                  <i class="bi bi-pencil"></i><span class="visually-hidden">Edit</span>
                </a>
                <form th:action="@{/students/{id}/status(id=${student.id})}" method="post" class="d-inline">
                  <input type="hidden" name="active" th:value="${student.active ? 'false' : 'true'}"/>
                  <button type="submit" class="btn btn-sm btn-outline-secondary">
                    <i th:class="|bi ${student.active ? 'bi-pause-circle' : 'bi-play-circle'}|"></i>
                    <span class="visually-hidden" th:text="${student.active ? 'Deactivate' : 'Activate'}">toggle</span>
                  </button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
          <div class="empty-state" th:if="${#lists.isEmpty(students.content)}">
            <i class="bi bi-person-plus d-block mb-2"></i>
            No students found. <a th:href="@{/students/new}">Register the first student</a>.
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{layout/fragments :: pager(${students}, ${pagerUrl})}"></div>

  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
