<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Teachers')}"></head>
<body class="app-body">
<a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>
<div th:replace="~{layout/fragments :: sidebar('teachers')}"></div>
<div class="app-main">
  <div th:replace="~{layout/fragments :: topbar('Teachers', true)}"></div>
  <main class="app-content" id="main" tabindex="-1">

    <div th:replace="~{layout/fragments :: alerts()}"></div>

    <header class="page-header">
      <div>
        <p class="page-eyebrow">
          <i class="bi bi-people" aria-hidden="true"></i><span>People</span>
        </p>
        <h2 class="page-title">Teaching staff</h2>
        <p class="page-subtitle">The teaching staff, their contact details and login accounts.</p>
      </div>
      <div class="filter-actions">
        <a th:href="@{/teachers/new}" class="btn btn-primary">
          <i class="bi bi-person-plus" aria-hidden="true"></i>New teacher profile
        </a>
      </div>
    </header>

    <div class="filter-bar">
      <form th:action="@{/teachers}" method="get" class="filter-form">
        <input type="search" class="form-control filter-search" placeholder="Search name, phone or email"
               name="q" th:value="${q}" aria-label="Search teachers"/>
        <select class="form-select" name="status" aria-label="Filter by status">
          <option value="">All teachers</option>
          <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active only</option>
          <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Inactive only</option>
        </select>
        <button type="submit" class="btn btn-outline-primary">
          <i class="bi bi-search" aria-hidden="true"></i>Search
        </button>
      </form>
    </div>

    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" th:if="${!#lists.isEmpty(teachers.content)}">
            <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Login account</th>
              <th class="text-center">Status</th>
              <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="teacher : ${teachers.content}">
              <td><a th:href="@{/teachers/{id}(id=${teacher.id})}" class="fw-semibold" th:text="${teacher.fullName}">Teacher</a></td>
              <td th:text="${teacher.phone}">phone</td>
              <td th:text="${teacher.email} ?: '-'">email</td>
              <td>
                <span class="small" th:if="${teacher.linkedUser != null}"
                      th:text="${teacher.linkedUser.email}">teacher@omsai.local</span>
                <span class="small text-body-secondary" th:if="${teacher.linkedUser == null}">Not linked</span>
              </td>
              <td class="text-center">
                <div th:replace="~{layout/fragments :: statusBadge(${teacher.active})}"></div>
              </td>
              <td class="text-end">
                <a th:href="@{/teachers/{id}(id=${teacher.id})}" class="btn btn-sm btn-outline-secondary" title="Profile">
                  <i class="bi bi-person"></i><span class="visually-hidden">Profile</span>
                </a>
                <a th:href="@{/teachers/{id}/edit(id=${teacher.id})}" class="btn btn-sm btn-outline-secondary" title="Edit">
                  <i class="bi bi-pencil"></i><span class="visually-hidden">Edit</span>
                </a>
                <form th:action="@{/teachers/{id}/status(id=${teacher.id})}" method="post" class="d-inline">
                  <input type="hidden" name="active" th:value="${teacher.active ? 'false' : 'true'}"/>
                  <button type="submit" class="btn btn-sm btn-outline-secondary">
                    <i th:class="|bi ${teacher.active ? 'bi-pause-circle' : 'bi-play-circle'}|"></i>
                    <span class="visually-hidden" th:text="${teacher.active ? 'Deactivate' : 'Activate'}">toggle</span>
                  </button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
          <div class="empty-state" th:if="${#lists.isEmpty(teachers.content)}">
            <i class="bi bi-person-plus d-block" aria-hidden="true"></i>
            <span class="empty-title">No teachers found</span>
            <a th:href="@{/teachers/new}">Create the first teacher profile</a>.
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{layout/fragments :: pager(${teachers}, ${pagerUrl})}"></div>

  </main>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
